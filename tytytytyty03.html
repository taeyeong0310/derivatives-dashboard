<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>예산 관리 대시보드</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 30px;
    }
    h1 {
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .hidden {
      display: none;
    }
    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, select {
      padding: 8px;
      margin: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
    button {
      padding: 8px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      margin: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>📘 학생 예산 관리 대시보드</h1>
    <button onclick="toggleSettings()">⚙ 설정</button>
  </div>

  <div class="section hidden" id="settings-section">
    <h2>설정</h2>
    <p>설정 기능은 여기에 추가됩니다. (예: 사용자 변경, 테마 설정 등)</p>
  </div>

  <div class="section">
    <h2>수입 입력</h2>
    <input type="date" id="income-date" />
    <input type="text" id="income-student" placeholder="학생 이름" />
    <input type="number" id="income-amount" placeholder="금액" />
    <button onclick="addRecord('수입')">수입 추가</button>
  </div>

  <div class="section">
    <h2>지출 입력</h2>
    <input type="date" id="expense-date" />
    <input type="text" id="expense-student" placeholder="학생 이름" />
    <input type="number" id="expense-amount" placeholder="금액" />
    <button onclick="addRecord('지출')">지출 추가</button>
  </div>

  <div class="section">
    <h2>내역</h2>
    <button onclick="sortRecords('date')">날짜순 정렬</button>
    <button onclick="sortRecords('student')">학생순 정렬</button>
    <table id="record-table">
      <thead>
        <tr>
          <th>날짜</th>
          <th>학생</th>
          <th>항목</th>
          <th>금액</th>
        </tr>
      </thead>
      <tbody>
        <!-- 기록이 여기에 추가됨 -->
      </tbody>
    </table>
  </div>

  <script>
    const records = [];

    function toggleSettings() {
      const section = document.getElementById('settings-section');
      section.classList.toggle('hidden');
    }

    function addRecord(type) {
      const date = document.getElementById(type === '수입' ? 'income-date' : 'expense-date').value;
      const student = document.getElementById(type === '수입' ? 'income-student' : 'expense-student').value;
      const amount = document.getElementById(type === '수입' ? 'income-amount' : 'expense-amount').value;

      if (!date || !student || !amount) {
        alert('모든 항목을 입력하세요.');
        return;
      }

      records.push({ date, student, type, amount: Number(amount) });
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('record-table').querySelector('tbody');
      tbody.innerHTML = '';
      records.forEach(rec => {
        const row = `<tr>
          <td>${rec.date}</td>
          <td>${rec.student}</td>
          <td>${rec.type}</td>
          <td>${rec.amount.toLocaleString()}원</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function sortRecords(key) {
      if (key === 'date') {
        records.sort((a, b) => a.date.localeCompare(b.date));
      } else if (key === 'student') {
        records.sort((a, b) => a.student.localeCompare(b.student));
      }
      renderTable();
    }
  </script>

</body>
</html>
