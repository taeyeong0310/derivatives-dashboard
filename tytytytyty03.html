<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과외 수입/지출 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
        }
        .modal {
            transition: opacity 0.25s ease;
        }
        .modal-active {
            overflow-y: visible !important;
        }
        .tab-active {
            background-color: #4299e1;
            color: white;
        }
        .form-input {
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.5rem;
            width: 100%;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th {
            cursor: pointer;
        }
        th:hover {
            background-color: #edf2f7;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6 flex justify-between items-center">
            <h1 id="systemTitle" class="text-2xl font-bold text-gray-800">과외 수입/지출 관리 시스템</h1>
            <div class="space-x-2">
                <button id="settingsBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg flex items-center">
                    <i class="fas fa-cog mr-2"></i> 설정
                </button>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6 grid grid-cols-3 gap-4">
            <div class="border p-4 rounded-lg bg-blue-50">
                <h3 class="text-sm text-gray-500 mb-1">총 수입</h3>
                <p id="totalIncome" class="text-xl font-bold text-blue-600">0원</p>
            </div>
            <div class="border p-4 rounded-lg bg-red-50">
                <h3 class="text-sm text-gray-500 mb-1">총 지출</h3>
                <p id="totalExpense" class="text-xl font-bold text-red-600">0원</p>
            </div>
            <div class="border p-4 rounded-lg bg-green-50">
                <h3 class="text-sm text-gray-500 mb-1">순이익</h3>
                <p id="totalProfit" class="text-xl font-bold text-green-600">0원</p>
            </div>
        </div>

        <!-- Entry Form Tabs -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <div class="flex border-b">
                <button id="incomeTab" class="tab-active py-3 px-6 font-medium text-center flex-1">
                    수입 입력
                </button>
                <button id="expenseTab" class="py-3 px-6 font-medium text-center flex-1 bg-gray-100 text-gray-700">
                    지출 입력
                </button>
            </div>

            <!-- Income Form -->
            <div id="incomeForm" class="p-4">
                <div class="grid grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">날짜</label>
                        <input type="date" id="incomeDate" class="form-input">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">학생명</label>
                        <input type="text" id="incomeStudent" class="form-input" placeholder="학생 이름">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">카테고리</label>
                        <select id="incomeCategory" class="form-input">
                            <option value="과외비">과외비</option>
                            <option value="특강비">특강비</option>
                            <option value="교재비">교재비</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">금액</label>
                        <input type="number" id="incomeAmount" class="form-input" placeholder="0">
                    </div>
                    <div class="flex items-end">
                        <button id="addIncome" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg w-full flex justify-center items-center">
                            <i class="fas fa-plus mr-2"></i> 추가
                        </button>
                    </div>
                </div>
                <div class="mt-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">비고</label>
                    <input type="text" id="incomeNote" class="form-input" placeholder="비고 사항">
                </div>
            </div>

            <!-- Expense Form -->
            <div id="expenseForm" class="p-4 hidden">
                <div class="grid grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">날짜</label>
                        <input type="date" id="expenseDate" class="form-input">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">관련 학생</label>
                        <input type="text" id="expenseStudent" class="form-input" placeholder="관련 학생 (선택사항)">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">카테고리</label>
                        <select id="expenseCategory" class="form-input">
                            <option value="중개수수료">중개수수료</option>
                            <option value="교재구입">교재구입</option>
                            <option value="교통비">교통비</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">금액</label>
                        <input type="number" id="expenseAmount" class="form-input" placeholder="0">
                    </div>
                    <div class="flex items-end">
                        <button id="addExpense" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg w-full flex justify-center items-center">
                            <i class="fas fa-plus mr-2"></i> 추가
                        </button>
                    </div>
                </div>
                <div class="mt-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">비고</label>
                    <input type="text" id="expenseNote" class="form-input" placeholder="비고 사항">
                </div>
            </div>
        </div>

        <!-- Transaction List -->
        <div class="bg-white rounded-lg shadow-md p-4">
            <div class="mb-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">거래 내역</h2>
                <div class="flex space-x-2">
                    <button id="sortByDate" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-1 px-3 rounded-lg text-sm">
                        날짜별 정렬
                    </button>
                    <button id="sortByStudent" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-1 px-3 rounded-lg text-sm">
                        학생별 정렬
                    </button>
                    <button id="backupBtn" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-1 px-3 rounded-lg text-sm">
                        백업
                    </button>
                    <button id="restoreBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-1 px-3 rounded-lg text-sm">
                        복원
                    </button>
                    <button id="clearBtn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-1 px-3 rounded-lg text-sm">
                        초기화
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-2 text-left">날짜</th>
                            <th class="p-2 text-left">구분</th>
                            <th class="p-2 text-left">카테고리</th>
                            <th class="p-2 text-left">학생명</th>
                            <th class="p-2 text-right">금액</th>
                            <th class="p-2 text-left">비고</th>
                            <th class="p-2 text-center">작업</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList">
                        <!-- 동적으로 추가될 내용 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-xl font-bold">시스템 설정</p>
                    <button class="modal-close cursor-pointer z-50">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- System Title Setting -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="systemTitleInput">
                        시스템 제목
                    </label>
                    <input id="systemTitleInput" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" placeholder="시스템 제목">
                </div>

                <!-- Income Categories -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        수입 카테고리 관리
                    </label>
                    <div class="flex mb-2">
                        <input id="newIncomeCategory" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" placeholder="새 카테고리">
                        <button id="addIncomeCategory" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded ml-2">
                            추가
                        </button>
                    </div>
                    <div class="bg-gray-100 p-2 rounded">
                        <ul id="incomeCategoryList" class="list-disc list-inside">
                            <!-- 동적으로 추가될 내용 -->
                        </ul>
                    </div>
                </div>

                <!-- Expense Categories -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        지출 카테고리 관리
                    </label>
                    <div class="flex mb-2">
                        <input id="newExpenseCategory" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" placeholder="새 카테고리">
                        <button id="addExpenseCategory" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded ml-2">
                            추가
                        </button>
                    </div>
                    <div class="bg-gray-100 p-2 rounded">
                        <ul id="expenseCategoryList" class="list-disc list-inside">
                            <!-- 동적으로 추가될 내용 -->
                        </ul>
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button id="saveSettings" class="px-4 bg-blue-500 p-2 rounded-lg text-white hover:bg-blue-600">
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Backup/Restore Modal -->
    <div id="backupModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-xl font-bold">데이터 백업/복원</p>
                    <button class="modal-close cursor-pointer z-50">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        백업 데이터
                    </label>
                    <textarea id="backupData" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline h-40" placeholder="백업 데이터를 붙여넣으세요."></textarea>
                </div>

                <div class="flex justify-between pt-2">
                    <button id="copyBackupData" class="px-4 bg-green-500 p-2 rounded-lg text-white hover:bg-green-600">
                        백업 데이터 복사
                    </button>
                    <button id="confirmRestore" class="px-4 bg-yellow-500 p-2 rounded-lg text-white hover:bg-yellow-600">
                        데이터 복원
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Clear Confirmation Modal -->
    <div id="clearModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-xl font-bold">데이터 초기화</p>
                    <button class="modal-close cursor-pointer z-50">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <p class="mb-4">정말로 모든 데이터를 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>

                <div class="flex justify-end pt-2">
                    <button class="modal-close px-4 bg-gray-500 p-2 rounded-lg text-white hover:bg-gray-600 mr-2">
                        취소
                    </button>
                    <button id="confirmClear" class="px-4 bg-red-500 p-2 rounded-lg text-white hover:bg-red-600">
                        초기화 확인
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 데이터 모델
        let transactions = [];
        let settings = {
            systemTitle: '과외 수입/지출 관리 시스템',
            incomeCategories: ['과외비', '특강비', '교재비', '기타'],
            expenseCategories: ['중개수수료', '교재구입', '교통비', '기타']
        };

        // DOM 요소
        document.addEventListener('DOMContentLoaded', function() {
            // 오늘 날짜를 기본값으로 설정
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('incomeDate').value = today;
            document.getElementById('expenseDate').value = today;

            // 설정 불러오기 및 적용
            loadSettings();
            applySettings();
            
            // 거래 데이터 불러오기
            loadTransactions();
            renderTransactions();
            updateSummary();

            // 탭 전환 이벤트
            document.getElementById('incomeTab').addEventListener('click', () => {
                document.getElementById('incomeForm').classList.remove('hidden');
                document.getElementById('expenseForm').classList.add('hidden');
                document.getElementById('incomeTab').classList.add('tab-active');
                document.getElementById('incomeTab').classList.remove('bg-gray-100', 'text-gray-700');
                document.getElementById('expenseTab').classList.remove('tab-active');
                document.getElementById('expenseTab').classList.add('bg-gray-100', 'text-gray-700');
            });

            document.getElementById('expenseTab').addEventListener('click', () => {
                document.getElementById('expenseForm').classList.remove('hidden');
                document.getElementById('incomeForm').classList.add('hidden');
                document.getElementById('expenseTab').classList.add('tab-active');
                document.getElementById('expenseTab').classList.remove('bg-gray-100', 'text-gray-700');
                document.getElementById('incomeTab').classList.remove('tab-active');
                document.getElementById('incomeTab').classList.add('bg-gray-100', 'text-gray-700');
            });

            // 수입 추가 이벤트
            document.getElementById('addIncome').addEventListener('click', () => {
                const date = document.getElementById('incomeDate').value;
                const student = document.getElementById('incomeStudent').value;
                const category = document.getElementById('incomeCategory').value;
                const amount = parseInt(document.getElementById('incomeAmount').value) || 0;
                const note = document.getElementById('incomeNote').value;

                if (!date || amount <= 0) {
                    alert('날짜와 금액을 올바르게 입력해주세요.');
                    return;
                }

                addTransaction({
                    id: Date.now(),
                    date,
                    type: '수입',
                    category,
                    student,
                    amount,
                    note
                });

                // 입력 폼 초기화
                document.getElementById('incomeStudent').value = '';
                document.getElementById('incomeAmount').value = '';
                document.getElementById('incomeNote').value = '';
            });

            // 지출 추가 이벤트
            document.getElementById('addExpense').addEventListener('click', () => {
                const date = document.getElementById('expenseDate').value;
                const student = document.getElementById('expenseStudent').value;
                const category = document.getElementById('expenseCategory').value;
                const amount = parseInt(document.getElementById('expenseAmount').value) || 0;
                const note = document.getElementById('expenseNote').value;

                if (!date || amount <= 0) {
                    alert('날짜와 금액을 올바르게 입력해주세요.');
                    return;
                }

                addTransaction({
                    id: Date.now(),
                    date,
                    type: '지출',
                    category,
                    student,
                    amount: -amount,  // 지출은 음수로 저장
                    note
                });

                // 입력 폼 초기화
                document.getElementById('expenseStudent').value = '';
                document.getElementById('expenseAmount').value = '';
                document.getElementById('expenseNote').value = '';
            });

            // 정렬 버튼 이벤트
            document.getElementById('sortByDate').addEventListener('click', () => {
                sortTransactions('date');
            });

            document.getElementById('sortByStudent').addEventListener('click', () => {
                sortTransactions('student');
            });

            // 백업/복원 버튼 이벤트
            document.getElementById('backupBtn').addEventListener('click', () => {
                openBackupModal();
            });

            document.getElementById('restoreBtn').addEventListener('click', () => {
                openBackupModal();
            });

            document.getElementById('copyBackupData').addEventListener('click', () => {
                const backupData = document.getElementById('backupData');
                backupData.select();
                document.execCommand('copy');
                alert('백업 데이터가 클립보드에 복사되었습니다.');
            });

            document.getElementById('confirmRestore').addEventListener('click', () => {
                restoreData();
            });

            // 초기화 버튼 이벤트
            document.getElementById('clearBtn').addEventListener('click', () => {
                openClearModal();
            });

            document.getElementById('confirmClear').addEventListener('click', () => {
                clearData();
                closeModal('clearModal');
            });

            // 설정 버튼 이벤트
            document.getElementById('settingsBtn').addEventListener('click', () => {
                openSettingsModal();
            });

            document.getElementById('saveSettings').addEventListener('click', () => {
                saveSettings();
                closeModal('settingsModal');
            });

            // 카테고리 추가 이벤트
            document.getElementById('addIncomeCategory').addEventListener('click', () => {
                const newCategory = document.getElementById('newIncomeCategory').value.trim();
                if (newCategory && !settings.incomeCategories.includes(newCategory)) {
                    settings.incomeCategories.push(newCategory);
                    updateCategoryList();
                    document.getElementById('newIncomeCategory').value = '';
                }
            });

            document.getElementById('addExpenseCategory').addEventListener('click', () => {
                const newCategory = document.getElementById('newExpenseCategory').value.trim();
                if (newCategory && !settings.expenseCategories.includes(newCategory)) {
                    settings.expenseCategories.push(newCategory);
                    updateCategoryList();
                    document.getElementById('newExpenseCategory').value = '';
                }
            });

            // 모달 닫기 버튼 이벤트
            document.querySelectorAll('.modal-close').forEach(button => {
                button.addEventListener('click', () => {
                    closeAllModals();
                });
            });

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', () => {
                    closeAllModals();
                });
            });
        });

        // 거래 추가 함수
        function addTransaction(transaction) {
            transactions.push(transaction);
            saveTransactions();
            renderTransactions();
            updateSummary();
        }

        // 거래 삭제 함수
        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            renderTransactions();
            updateSummary();
        }

        // 거래 렌더링 함수
        function renderTransactions() {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';

            transactions.forEach(t => {
                const row = document.createElement('tr');
                row.className = t.amount >= 0 ? 'border-b hover:bg-blue-50' : 'border-b hover:bg-red-50';

                row.innerHTML = `
                    <td class="p-2">${formatDate(t.date)}</td>
                    <td class="p-2">${t.type}</td>
                    <td class="p-2">${t.category}</td>
                    <td class="p-2">${t.student || '-'}</td>
                    <td class="p-2 text-right ${t.amount >= 0 ? 'text-blue-600' : 'text-red-600'}">${formatCurrency(t.amount)}</td>
                    <td class="p-2">${t.note || ''}</td>
                    <td class="p-2 text-center">
                        <button class="text-red-500 hover:text-red-700" onclick="deleteTransaction(${t.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        // 요약 정보 업데이트 함수
        function updateSummary() {
            const totalIncome = transactions
                .filter(t => t.amount > 0)
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalExpense = transactions
                .filter(t => t.amount < 0)
                .reduce((sum, t) => sum + Math.abs(t.amount), 0);
            
            const profit = totalIncome - totalExpense;

            document.getElementById('totalIncome').textContent = formatCurrency(totalIncome);
            document.getElementById('totalExpense').textContent = formatCurrency(totalExpense);
            document.getElementById('totalProfit').textContent = formatCurrency(profit);
        }

        // 거래 정렬 함수
        function sortTransactions(field) {
            if (field === 'date') {
                transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else if (field === 'student') {
                transactions.sort((a, b) => {
                    const studentA = a.student || '';
                    const studentB = b.student || '';
                    return studentA.localeCompare(studentB, 'ko');
                });
            }
            renderTransactions();
        }

        // 데이터 저장/불러오기 함수
        function saveTransactions() {
            localStorage.setItem('tutorTransactions', JSON.stringify(transactions));
        }

        function loadTransactions() {
            const saved = localStorage.getItem('tutorTransactions');
            if (saved) {
                transactions = JSON.parse(saved);
            }
        }

        function saveSettings() {
            settings.systemTitle = document.getElementById('systemTitleInput').value || settings.systemTitle;
            localStorage.setItem('tutorSettings', JSON.stringify(settings));
            applySettings();
        }

        function loadSettings() {
            const saved = localStorage.getItem('tutorSettings');
            if (saved) {
                settings = JSON.parse(saved);
            }
        }

        function applySettings() {
            // 시스템 제목 적용
            document.getElementById('systemTitle').textContent = settings.systemTitle;
            document.getElementById('systemTitleInput').value = settings.systemTitle;
            document.title = settings.systemTitle;

            // 카테고리 적용
            const incomeSelect = document.getElementById('incomeCategory');
            const expenseSelect = document.getElementById('expenseCategory');
            
            incomeSelect.innerHTML = '';
            settings.incomeCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                incomeSelect.appendChild(option);
            });
            
            expenseSelect.innerHTML = '';
            settings.expenseCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                expenseSelect.appendChild(option);
            });

            updateCategoryList();
        }

        // 카테고리 목록 업데이트
        function updateCategoryList() {
            const incomeList = document.getElementById('incomeCategoryList');
            const expenseList = document.getElementById('expenseCategoryList');
            
            incomeList.innerHTML = '';
            settings.incomeCategories.forEach(category => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center py-1';
                li.innerHTML = `
                    <span>${category}</span>
                    <button class="text-red-500 hover:text-red-700" onclick="removeCategory('income', '${category}')">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                incomeList.appendChild(li);
            });
            
            expenseList.innerHTML = '';
            settings.expenseCategories.forEach(category => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center py-1';
                li.innerHTML = `
                    <span>${category}</span>
                    <button class="text-red-500 hover:text-red-700" onclick="removeCategory('expense', '${category}')">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                expenseList.appendChild(li);
            });
        }

        // 카테고리 삭제
        function removeCategory(type, category) {
            if (type === 'income') {
                settings.incomeCategories = settings.incomeCategories.filter(c => c !== category);
            } else {
                settings.expenseCategories = settings.expenseCategories.filter(c => c !== category);
            }
            updateCategoryList();
        }

        // 모달 제어 함수
        function openSettingsModal() {
            const modal = document.getElementById('settingsModal');
            document.getElementById('systemTitleInput').value = settings.systemTitle;
            updateCategoryList();
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function openBackupModal() {
            const modal = document.getElementById('backupModal');
            document.getElementById('backupData').value = JSON.stringify({
                transactions,
                settings
            });
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function openClearModal() {
            const modal = document.getElementById('clearModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            });
            document.body.classList.remove('modal-active');
        }

        // 백업 데이터 복원
        function restoreData() {
            try {
                const data = JSON.parse(document.getElementById('backupData').value);
                if (data.transactions && data.settings) {
                    transactions = data.transactions;
                    settings = data.settings;
                    saveTransactions();
                    saveSettings();
                    applySettings();
                    renderTransactions();
                    updateSummary();
                    closeModal('backupModal');
                    alert('데이터가 성공적으로 복원되었습니다.');
                } else {
                    alert('유효하지 않은 백업 데이터입니다.');
                }
            } catch (e) {
                alert('데이터 복원에 실패했습니다. 올바른 백업 데이터를 입력해주세요.');
            }
        }

        // 데이터 초기화
        function clearData() {
            transactions = [];
            saveTransactions();
            renderTransactions();
            updateSummary();
            alert('모든 거래 데이터가 초기화되었습니다.');
        }

        // 유틸리티 함수
        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('ko-KR', { 
                style: 'decimal',
                maximumFractionDigits: 0
            }).format(Math.abs(amount)) + '원';
        }
    </script>
</body>
</html>
